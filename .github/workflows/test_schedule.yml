
name: Test Scheduled Runs

on:
  workflow_dispatch:

  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled execution
        run: |
          echo "GitHub Actions scheduling works!"
          echo "Event: ${{ github.event_name }}"
          date -u
