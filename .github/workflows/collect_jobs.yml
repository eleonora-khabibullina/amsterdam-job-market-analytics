
name: Collect Booking.com Jobs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-job-collection
  cancel-in-progress: false

jobs:
  collect-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run data pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m amsterdam_jobs.pipeline

      - name: Export jobs to Google Sheets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          credentials_file="$(mktemp "$RUNNER_TEMP/google-service-account.XXXXXX")"
          trap 'rm -f "$credentials_file"' EXIT

          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          export GOOGLE_SERVICE_ACCOUNT_FILE="$credentials_file"

          python -m amsterdam_jobs.export_to_sheets
