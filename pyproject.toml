
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amsterdam-job-market-analytics"
version = "0.1.0"
description = "Analytics of job market trends in Amsterdam"
requires-python = ">=3.13"

dependencies = [
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0"
]

[project.scripts]
amsterdam-jobs = "amsterdam_jobs.main:main"

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
analysis = [
    "pandas",
    "ipykernel"
]
